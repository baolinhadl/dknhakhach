{% extends 'base.html' %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="card-title mb-3">Thêm hồ sơ quân nhân</h4>
          <form method="post">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Họ và tên *</label>
                <input class="form-control" name="hovaten" required>
              </div>
              <div class="col-md-3">
                <label class="form-label">Ngày sinh</label>
                <input class="form-control" type="date" name="ngaysinh">
              </div>
              <div class="col-md-3">
                <label class="form-label">Nhập ngũ</label>
                <input class="form-control" type="date" name="nhapngu">
              </div>
              <div class="col-md-4">
                <label class="form-label">Cấp bậc</label>
                <input class="form-control" name="capbac">
              </div>
              <div class="col-md-4">
                <label class="form-label">Chức vụ</label>
                <input class="form-control" name="chucvu">
              </div>
              <div class="col-md-4">
                <label class="form-label">Đơn vị</label>
                <input class="form-control" name="donvi">
              </div>
              <div class="col-md-4">
                <label class="form-label">Dân tộc</label>
                <input class="form-control" name="dantoc">
              </div>
              <div class="col-md-4">
                <label class="form-label">Tôn giáo</label>
                <input class="form-control" name="tongiao">
              </div>
              <div class="col-md-4">
                <label class="form-label">Văn hóa</label>
                <input class="form-control" name="vanhoa">
              </div>
              <div class="col-md-6">
                <label class="form-label">Họ tên cha/mẹ</label>
                <input class="form-control" name="hotencha">
              </div>
              <div class="col-md-6">
                <label class="form-label">Quê quán</label>
                <input class="form-control" name="quequan">
              </div>
              <div class="col-md-6">
                <label class="form-label">SĐT gia đình</label>
                <input class="form-control" name="sdtgiadinh">
              </div>
              <div class="col-12">
                <label class="form-label">Ghi chú</label>
                <textarea class="form-control" name="ghichu" rows="2"></textarea>
              </div>
            </div>
            <div class="mt-3 d-flex justify-content-between align-items-center">
              <a class="btn btn-link" href="{{ url_for('index') }}">Quay lại</a>
              <button class="btn btn-primary" type="submit">Lưu hồ sơ</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
